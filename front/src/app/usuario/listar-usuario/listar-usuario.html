<div class="row justify-content-end">
  <div class="col-lg-1 col-12">
    <button class="btn btn-success" (click)="NuevoUsuario()" data-bs-toggle="modal" data-bs-target="#modalUsuario">Nuevo</button>
  </div>
</div>

<div class="d-flex justify-content-center"*ngIf="isLoadig">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="row" *ngIf="!isLoadig">
    <div class="col12">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Fecha registro</th>
                    <th scope="col">Editar</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let us of VectorUsuarios">
                    <th scope="row">{{us.IdEstudiante}}</th>
                    <td>{{us.NombreEstudiante}}</td>
                    <td>{{us.FechaRegistro | date:'dd/MM/yyyy HH:mm'}}</td>
                    <td>
                            <button class="btn btn-warning me-1" data-bs-toggle="modal" data-bs-target="#modalUsuario" (click)="EditarUsuario(us)">Editar</button>
                            <button class="btn btn-danger me-1" (click)="EliminarUsuario(us)">Eliminar</button>
                    </td>
                </tr>

            </tbody>
        </table>

    </div>
</div>


<!-- Modal -->
<div class="modal fade" id="modalUsuario" #modalUsuario data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalUsuarioLabel">{{isNew?'Nuevo':'Editar'}} Usuario {{this.usuarioSelecciona?.NombreEstudiante}}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-cu-usuario [usuario]="usuarioSelecciona"></app-cu-usuario>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="GuardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>
</div>
