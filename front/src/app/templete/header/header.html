<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNIFIED</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* === NAVBAR estilo UNIFIED === */
    .unified-navbar {
      background-color: #a6f080;
      padding: 10px 30px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .unified-logo {
      color: white !important;
      font-size: 2em;
      font-weight: bold;
      text-shadow: 0 0 10px white;
    }

    /* === Imagen cerebro === */

    .brain-img {
      width: 160px;
    }

    /* === Contenedor principal === */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 85vh;
      text-align: center;
    }

    /* === Contenedor de botones (HORIZONTAL) === */
    .buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 80%;
      max-width: 900px;
      margin-top: 50px;
      gap: 40px;
    }

    /* === Botones estilo UNIFIED === */
    .menu-btn {
      flex: 1;
      padding: 60px 0;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 1.8em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 3px 6px 0 rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: block;
    }

    .menu-btn:hover {
      transform: translateY(-4px);
      box-shadow: 4px 8px 0 rgba(0, 0, 0, 0.15);
    }

    .btn-usuarios {
      background-color: #64e35a;
    }

    .btn-materias {
      background-color: #4dabf7;
    }

    .btn-carreras {
      background-color: #ffb74d;
    }

    /* === Modo oscuro === */
    body.dark-mode {
      background-color: #1c1c1c;
      color: #f5f5f5;
    }

    body.dark-mode .unified-navbar {
      background-color: #333;
    }

    body.dark-mode .menu-btn {
      box-shadow: 2px 4px 0 rgba(255, 255, 255, 0.1);
    }

    body.dark-mode .btn-usuarios {
      background-color: #2e7d32;
    }

    body.dark-mode .btn-materias {
      background-color: #1565c0;
    }

    body.dark-mode .btn-carreras {
      background-color: #e68900;
    }

    /* === Switch de modo oscuro === */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ddd;
      border-radius: 24px;
      transition: 0.4s;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }

    input:checked + .slider {
      background-color: #4caf50;
    }

    input:checked + .slider::before {
      transform: translateX(26px);
    }

    .icon-sun, .icon-moon {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <!-- === NAVBAR === -->
  <nav class="navbar unified-navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a class="navbar-brand unified-logo" href="#">UNIFIED</a>
      
      <!-- Switch modo oscuro -->
      <div class="theme-toggle d-flex align-items-center">
        <span class="icon-sun">☀️</span>
        <label class="switch">
          <input type="checkbox" id="themeSwitch">
          <span class="slider"></span>
        </label>
        <span class="icon-moon">🌙</span>
      </div>
    </div>
  </nav>

  <!-- === CONTENIDO PRINCIPAL === -->
  <main>
    <img src="brain.png" alt="Cerebro leyendo" class="brain-img">
    <h2 class="fw-bold mt-4">¡Convierte tu aprendizaje en una experiencia divertida!</h2>

    <div class="buttons">
      <a href="http://localhost:4200/usuarios" class="menu-btn btn-usuarios">USUARIOS</a>
      <a href="http://localhost:4200/materias" class="menu-btn btn-materias">MATERIAS</a>
      <a href="http://localhost:4200/carrera" class="menu-btn btn-carreras">CARRERAS</a>
    </div>
  </main>

  <!-- === Script modo oscuro === -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const themeSwitch = document.getElementById("themeSwitch");

      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
        themeSwitch.checked = true;
      }

      themeSwitch.addEventListener("change", () => {
        const dark = themeSwitch.checked;
        document.body.classList.toggle("dark-mode", dark);
        localStorage.setItem("darkMode", dark);
      });
    });
  </script>
</body>
</html>
